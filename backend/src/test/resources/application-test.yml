spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6370  # won't connect — cache is disabled in tests
  rabbitmq:
    host: localhost
    port: 5672
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration

app:
  jwt:
    secret: test-secret-key-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  minio:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: test-bucket
    public-url: http://localhost:9000/test-bucket
  cors:
    allowed-origins: http://localhost:3000
